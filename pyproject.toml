[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "vezlu"
version = "0.1.0"
description = "Local text alternatives with guarded whole-artifact combination"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "polootyyyyy"}]
dependencies = ["mcp==2.3.0"]

[project.scripts]
vezlu = "vezlu:main"

[tool.setuptools]
py-modules = ["vezlu"]
